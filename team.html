<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team · FestivaMedia</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="tasks.css"></head>
<body><main class="main tasks-page"><a class="back" href="index.html">← Dashboard</a><header class="topbar"><div><p class="eyebrow">MEDIA TEAM</p><h1>Team directory</h1></div></header><section class="panel"><div class="panel-heading"><div><p class="eyebrow">PEOPLE</p><h3>Members and roles</h3></div><input id="teamSearch" placeholder="Search members" aria-label="Search members"></div><div id="teamList"><p class="empty">Loading team…</p></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const client=window.supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.key),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const {data:session}=await client.auth.getSession(),list=document.getElementById('teamList');if(!session.session){list.innerHTML='<p class="empty">Please sign in from the dashboard to view the team.</p>';return}const {data,error}=await client.from('team_profiles').select('full_name,email,role').order('full_name');if(error){list.innerHTML=`<p class="empty">${esc(error.message)}</p>`;return}list.innerHTML=(data||[]).map(x=>`<div class="task-row"><div><strong>${esc(x.full_name)}</strong><small>${esc(x.email||'')}</small></div><div>${esc(x.role||'designer')}</div></div>`).join('')||'<p class="empty">No team members yet.</p>'})();
</script><script>document.getElementById('teamSearch').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#teamList .task-row').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q))};</script></body></html>
